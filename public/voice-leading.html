<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(
  'https://pkrvnrgqtuvbtusdncok.supabase.co',
  'sb_publishable_511wgi5up_rKkUMIL91U7A_i_FhDnhE'
);
const $ = id => document.getElementById(id);

/* ---------- chord model (duplicated from Time Trials — DRY later) ---------- */
const ROOTS = [
  {name:"C",pc:0},{name:"C♯",pc:1},{name:"D",pc:2},{name:"E♭",pc:3},
  {name:"E",pc:4},{name:"F",pc:5},{name:"F♯",pc:6},{name:"G",pc:7},
  {name:"A♭",pc:8},{name:"A",pc:9},{name:"B♭",pc:10},{name:"B",pc:11},
];
const CHORD_TYPES = {
  major: { suffix:" Major", sym:"",  ivals:[0,4,7] },
  minor: { suffix:" minor", sym:"m", ivals:[0,3,7] },
};
const PC_NAME = {}; ROOTS.forEach(r => PC_NAME[r.pc] = r.name);
function chordFor(r, type, inv){
  const T = CHORD_TYPES[type];
  const pcs = T.ivals.map(i => (r.pc + i) % 12);
  if(!inv) return { name:r.name+T.suffix, type, inv:0, pcs, bass:r.pc };
  const bass = (r.pc + T.ivals[inv]) % 12;
  return { name:r.name+T.sym+"/"+PC_NAME[bass], type, inv, pcs, bass };
}
const shuffled = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- keyboard visual (duplicated from Time Trials) ---------- */
const WHITE = new Set([0,2,4,5,7,9,11]), ACCENT = "#5b7cfa";
const isW = a => WHITE.has(((a%12)+12)%12), nm = a => PC_NAME[((a%12)+12)%12];
function keyboardSVG(chord){
  const pcs = chord.pcs, bassPc = chord.bass!=null?chord.bass:pcs[0], bassAbs = bassPc+24;
  const lit = new Set(pcs.map(pc => bassAbs + ((pc-bassPc+12)%12))), top = Math.max(...lit);
  let sA = bassAbs-2; while(!isW(sA)) sA--;
  let eA = top+2;     while(!isW(eA)) eA++;
  const W=24,H=96,BW=15,BH=60, whites=[];
  for(let a=sA;a<=eA;a++) if(isW(a)) whites.push(a);
  const width = whites.length*W, wI={}; whites.forEach((a,i)=>wI[a]=i);
  let s = `<svg class="hint-kbd" viewBox="0 0 ${width} ${H}" width="${width}" height="${H}">`;
  whites.forEach((a,i)=>{ const on=lit.has(a);
    s += `<rect x="${i*W}" y="0" width="${W-1}" height="${H}" rx="3" fill="${on?ACCENT:'#ffffff'}" stroke="#dcdce3"/>`;
    if(on) s += `<text x="${i*W+W/2}" y="${H-9}" text-anchor="middle" font-size="9" fill="#ffffff">${nm(a)}</text>`;
  });
  for(let a=sA;a<=eA;a++){ if(isW(a)) continue;
    const x=(wI[a-1]+1)*W-BW/2, on=lit.has(a);
    s += `<rect x="${x}" y="0" width="${BW}" height="${BH}" rx="2" fill="${on?ACCENT:'#2a2a30'}"/>`;
    if(on) s += `<text x="${x+BW/2}" y="${BH-7}" text-anchor="middle" font-size="8" fill="#ffffff">${nm(a)}</text>`;
  }
  return s + `</svg>`;
}

/* ---------- voice-leading math ---------- */
const PERMS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
// minimum total voice movement between two played triads (3 absolute notes each)
function transDist(a, b){
  let best = Infinity;
  for(const p of PERMS){
    const d = Math.abs(a[0]-b[p[0]]) + Math.abs(a[1]-b[p[1]]) + Math.abs(a[2]-b[p[2]]);
    if(d < best) best = d;
  }
  return best;
}
// all close-position voicings of a triad: 3 inversions across a few octaves
function voicings(ch){
  const out = [];
  for(let oct = 3; oct <= 5; oct++){
    for(let inv = 0; inv < 3; inv++){
      const base = 12*oct, rot = [];
      for(let k=0;k<3;k++) rot.push((ch.root + ch.ivals[(inv+k)%3]) % 12);
      const notes = [base + rot[0]];
      for(let k=1;k<3;k++){ let n = base + rot[k]; while(n <= notes[k-1]) n += 12; notes.push(n); }
      out.push({ notes, inv });
    }
  }
  return out;
}
// smoothest playable route through the progression (min total movement) via DP
function optimalRoute(prog){
  const V = prog.map(voicings);
  let cost = V[0].map(() => 0);
  const back = V.map(() => []);
  for(let i=1;i<V.length;i++){
    const next = [];
    for(let j=0;j<V[i].length;j++){
      let best=Infinity, bi=0;
      for(let k=0;k<V[i-1].length;k++){
        const d = cost[k] + transDist(V[i-1][k].notes, V[i][j].notes);
        if(d < best){ best=d; bi=k; }
      }
      next.push(best); back[i][j]=bi;
    }
    cost = next;
  }
  let best=Infinity, bj=0;
  for(let j=0;j<cost.length;j++) if(cost[j] < best){ best=cost[j]; bj=j; }
  const seq=[]; let j=bj;
  for(let i=V.length-1;i>=0;i--){ seq[i]=V[i][j]; if(i>0) j=back[i][j]; }
  return { distance: best, voicings: seq };
}

/* ---------- game ---------- */
let progression = [], played = [], step = 0, phase = 'ready';
let startTime = 0, endTime = 0;
const held = new Map();

function randomProgression(){
  const roots = shuffled([...Array(12).keys()]).slice(0, 3);   // 3 distinct roots
  const types = ['major','minor'];
  return roots.map(pc => {
    const type = types[Math.floor(Math.random()*2)], r = ROOTS[pc];
    return { root: pc, type, ivals: CHORD_TYPES[type].ivals, pcs: chordFor(r, type, 0).pcs, name: r.name + CHORD_TYPES[type].suffix };
  });
}
function newRound(){
  progression = randomProgression(); played = []; step = 0; phase = 'ready';
  $('vlResults').hidden = true;
  renderProg();
}
function renderProg(){
  $('vlProg').innerHTML = progression.map((ch,i) => {
    const cls = 'vl-chord' + (i < step ? ' done' : '') + (i === step && phase !== 'done' ? ' current' : '');
    return '<span class="'+cls+'">'+ch.name+'</span>';
  }).join('<span class="vl-sep">→</span>');
}
function checkStep(){
  if(phase === 'done') return;
  const notes = [...held.keys()];
  if(notes.length !== 3) return;
  const pcs = new Set(notes.map(n => ((n%12)+12)%12));
  if(pcs.size !== 3) return;
  for(const t of progression[step].pcs) if(!pcs.has(t)) return;   // must be exactly this triad (any voicing)
  recordStep(notes.slice().sort((a,b)=>a-b));
}
function recordStep(notes){
  played[step] = notes;
  if(step === 0){ $('vlResults').hidden = true; startTime = performance.now(); phase = 'playing'; }
  step++;
  if(step >= progression.length){ endTime = performance.now(); finish(); return; }
  renderProg();
}
function finish(){
  const secs = (endTime - startTime) / 1000;
  let yours = 0;
  for(let i=1;i<played.length;i++) yours += transDist(played[i-1], played[i]);
  const opt = optimalRoute(progression);
  const best = Math.min(opt.distance, yours);   // guard: never show "you beat the best"
  $('vlTime').textContent = secs.toFixed(2) + 's';
  $('vlDist').innerHTML = yours + ' <span class="vl-sub">semitones · best ' + best + '</span>';
  $('vlResults').hidden = false;
  // reset to replay the SAME progression on the next play (results stay as a reference); spacebar = a new one
  played = []; step = 0; phase = 'ready';
  renderProg();
}

/* ---------- MIDI ---------- */
function setStatus(on, t){ $('statusDot').classList.toggle('on', !!on); $('statusText').textContent = t; }
async function initMidi(){
  if(!navigator.requestMIDIAccess){ setStatus(false, "Web MIDI needs Chrome/Edge on desktop"); return; }
  try {
    const access = await navigator.requestMIDIAccess({sysex:false});
    const pick = () => {
      const ins = [...access.inputs.values()];
      ins.forEach(i => i.onmidimessage = onMidi);
      setStatus(ins.length > 0, ins.length ? (ins[0].name || "keyboard connected") : "no keyboard connected");
    };
    access.onstatechange = pick; pick();
  } catch(e){ console.error('MIDI', e); setStatus(false, "MIDI unavailable — reload"); }
}
function onMidi(ev){
  const [st,d1,d2] = ev.data, cmd = st & 0xF0;
  if(cmd===0x90 && d2>0) held.set(d1,d2);
  else if(cmd===0x80 || (cmd===0x90 && d2===0)) held.delete(d1);
  checkStep();
}

/* ---------- account nav ---------- */
function renderNav(session){
  const nav = $('navAccount');
  if(session){
    const name = session.user.user_metadata?.username || 'account';
    nav.innerHTML = `<div class="user-menu">
        <button class="nav-user" type="button">@${name} <span class="caret">▾</span></button>
        <div class="user-dropdown">
          <a href="/dashboard">My Dashboard</a>
          <button class="dd-logout" id="logoutBtn">log out</button>
        </div>
      </div>`;
    $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
  } else {
    nav.innerHTML = `<a class="nav-btn" href="/?login=1">log in</a>`;
  }
}

/* ---------- wiring ---------- */
document.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); newRound(); }   // spacebar = new progression, anytime
});

(async () => {
  const { data:{ session } } = await supabase.auth.getSession();
  renderNav(session);
  newRound();
  initMidi();
})();
</script>
