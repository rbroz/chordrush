<title>Practice — ChordRush</title>
<meta name="description" content="Warm up piano chord shapes on your MIDI keyboard — pick a chord type and voicing, then play each shape to light it up.">

<style>
  .hint-kbd { max-width: 100%; height: auto; }
  .hint-kbd text { font-family: var(--mono); font-weight: 600; }
  /* Practice-only: pack it so the whole board fits without scrolling */
  .filterbars { margin-top: 3vh; }
  .board-hdr { text-align: center; color: var(--muted); font-size: 13px; margin: 2vh 0 16px; }
  .warm-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 1040px; margin: 0 auto 3vh; }
  .warm-card { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 11px 14px 9px; border: 1px solid var(--line); border-radius: 12px; transition: background .08s, border-color .08s; }
  .warm-card.played { border-color: var(--accent); }
  .warm-card.lit { background: var(--accent); border-color: var(--accent); }
  .warm-card.lit .warm-name, .warm-card.lit .warm-count { color: #fff; }
  .warm-kbd svg { display: block; height: clamp(56px, 8vh, 96px); width: auto; }   /* scales with viewport height */
  .warm-name { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--text); }
  .warm-count { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .warm-card.played .warm-count { color: var(--accent); }
  .site-footer { margin: 22px auto 20px; }
</style>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(
  'https://pkrvnrgqtuvbtusdncok.supabase.co',
  'sb_publishable_511wgi5up_rKkUMIL91U7A_i_FhDnhE'
);
const $ = id => document.getElementById(id);

/* ---------- chord model (duplicated from Time Trials — DRY later) ---------- */
const ROOTS = [
  {name:"C",pc:0},{name:"C♯",pc:1},{name:"D",pc:2},{name:"E♭",pc:3},
  {name:"E",pc:4},{name:"F",pc:5},{name:"F♯",pc:6},{name:"G",pc:7},
  {name:"A♭",pc:8},{name:"A",pc:9},{name:"B♭",pc:10},{name:"B",pc:11},
];
const CHORD_TYPES = {
  major: { suffix:" Major", sym:"",     ivals:[0,4,7] },
  minor: { suffix:" minor", sym:"m",    ivals:[0,3,7] },
  dim:   { suffix:" dim",   sym:"°",    ivals:[0,3,6] },
  aug:   { suffix:" aug",   sym:"+",    ivals:[0,4,8] },
  sus2:  { suffix:" sus2",  sym:"sus2", ivals:[0,2,7] },
  sus4:  { suffix:" sus4",  sym:"sus4", ivals:[0,5,7] },
  maj7:  { suffix:" maj7",  sym:"maj7", ivals:[0,4,7,11] },
  min7:  { suffix:" m7",    sym:"m7",   ivals:[0,3,7,10] },
  dom7:  { suffix:"7",      sym:"7",    ivals:[0,4,7,10] },
};
const PC_NAME = {}; ROOTS.forEach(r => PC_NAME[r.pc] = r.name);
// anyVoicing = accept any bass (used by the "any" voicing option — no inversion required)
function chordFor(r, type, inv=0, anyVoicing=false){
  const T = CHORD_TYPES[type];
  const pcs = T.ivals.map(i => (r.pc + i) % 12);
  if(anyVoicing) return { name:r.name+T.suffix, type, inv:0, pcs };   // no bass requirement
  if(!inv)       return { name:r.name+T.suffix, type, inv:0, pcs, bass:r.pc };
  const bass = (r.pc + T.ivals[inv]) % 12;
  return { name:r.name+T.sym+"/"+PC_NAME[bass], type, inv, pcs, bass };
}

/* ---------- keyboard visual (duplicated from Time Trials) ---------- */
const WHITE = new Set([0,2,4,5,7,9,11]), ACCENT = "#5b7cfa";
const isW = a => WHITE.has(((a%12)+12)%12), nm = a => PC_NAME[((a%12)+12)%12];
function keyboardSVG(chord){
  const pcs = chord.pcs, bassPc = chord.bass!=null?chord.bass:pcs[0], bassAbs = bassPc+24;
  const lit = new Set(pcs.map(pc => bassAbs + ((pc-bassPc+12)%12))), top = Math.max(...lit);
  let sA = bassAbs-2; while(!isW(sA)) sA--;
  let eA = top+2;     while(!isW(eA)) eA++;
  const W=24,H=96,BW=15,BH=60, whites=[];
  for(let a=sA;a<=eA;a++) if(isW(a)) whites.push(a);
  const width = whites.length*W, wI={}; whites.forEach((a,i)=>wI[a]=i);
  let s = `<svg class="hint-kbd" viewBox="0 0 ${width} ${H}" width="${width}" height="${H}">`;
  whites.forEach((a,i)=>{ const on=lit.has(a);
    s += `<rect x="${i*W}" y="0" width="${W-1}" height="${H}" rx="3" fill="${on?ACCENT:'#ffffff'}" stroke="#dcdce3"/>`;
    if(on) s += `<text x="${i*W+W/2}" y="${H-9}" text-anchor="middle" font-size="9" fill="#ffffff">${nm(a)}</text>`;
  });
  for(let a=sA;a<=eA;a++){ if(isW(a)) continue;
    const x=(wI[a-1]+1)*W-BW/2, on=lit.has(a);
    s += `<rect x="${x}" y="0" width="${BW}" height="${BH}" rx="2" fill="${on?ACCENT:'#2a2a30'}"/>`;
    if(on) s += `<text x="${x+BW/2}" y="${BH-7}" text-anchor="middle" font-size="8" fill="#ffffff">${nm(a)}</text>`;
  }
  return s + `</svg>`;
}
// does the currently-held set voice this exact chord? (right notes + right bass unless any-voicing)
function matchesChord(notes, c){
  if(!notes.length) return false;
  const tgt = new Set(c.pcs), h = new Set(notes.map(n => n%12));
  if(h.size !== tgt.size) return false;
  for(const p of tgt) if(!h.has(p)) return false;
  if(c.bass != null && (Math.min(...notes)%12) !== c.bass) return false;
  return true;
}

/* ---------- filter nav (same model as Time Trials): one chord type × one voicing ---------- */
const enabled    = { major:true, minor:false, dim:false, aug:false, sus2:false, sus4:false, maj7:false, min7:false, dom7:false };
const enabledInv = { 0:true, 1:false, 2:false, 3:false };
let freestyle = true;   // default = "any voicing": show root shapes, accept any inversion
const enabledTypes = ()=>Object.keys(enabled).filter(t=>enabled[t]);
const enabledInvs  = ()=>[0,1,2,3].filter(i=>enabledInv[i]);
function toggleType(type){
  if(enabled[type] && enabledTypes().length===1) return;   // already the sole pick → no-op
  for(const t in CHORD_TYPES) enabled[t]=false;            // single-select: one chord type at a time
  enabled[type]=true;
  refresh();
}
function toggleInv(i){
  if(!freestyle && enabledInv[i] && enabledInvs().length===1) return;  // already the sole pick → no-op
  freestyle=false;
  enabledInv[0]=false; enabledInv[1]=false; enabledInv[2]=false; enabledInv[3]=false;   // single-select: one voicing at a time
  enabledInv[i]=true;
  refresh();
}
function toggleFreestyle(){
  if(freestyle) return;   // already the sole pick → no-op
  freestyle=true;
  refresh();
}
// "3rd inv" only exists for 7th chords → show it only when a 7th is picked; fall back to root on a triad
function syncThirdInv(){
  const has3rd = enabledTypes().some(t => CHORD_TYPES[t].ivals.length === 4);
  const btn = document.querySelector('#invbar .filter[data-inv="3"]');
  if(btn) btn.hidden = !has3rd;
  if(!has3rd && enabledInv[3]){ enabledInv[0]=true; enabledInv[1]=false; enabledInv[2]=false; enabledInv[3]=false; }
}
function refresh(){
  syncThirdInv();
  document.querySelectorAll(".filter[data-type]").forEach(b=>b.classList.toggle("active", !!enabled[b.dataset.type]));
  document.querySelectorAll("#invbar .filter[data-inv]").forEach(b=>b.classList.toggle("active", !freestyle && !!enabledInv[b.dataset.inv]));
  const fb=$("freeBtn"); if(fb) fb.classList.toggle("active", freestyle);
  const vb=$("voiceFilterBtn"); if(vb) vb.classList.toggle("on", !freestyle);   // icon accent when a specific voicing is filtered
  renderBoard();
}

/* ---------- warmup board: the 12 shapes for the selected type × voicing ---------- */
let boardChords = [];
const playCounts = {};   // chord key → times played this session (survives set switches, resets on reload)
let lastKey = null;      // last chord that counted — guards against mashing the same chord
let litState = [];       // per-card previous match state, for rising-edge detection
const chordKey = c => c.pcs.join(',') + '|' + (c.bass ?? 'any');
function renderBoard(){
  const type = enabledTypes()[0], inv = enabledInvs()[0];
  boardChords = ROOTS.map(r => freestyle ? chordFor(r, type, 0, true) : chordFor(r, type, inv));
  litState = boardChords.map(()=>false);
  $("warmGrid").innerHTML = boardChords.map((c,i) => {
    const n = playCounts[chordKey(c)] || 0;
    return '<div class="warm-card'+(n?' played':'')+'" data-idx="'+i+'"><div class="warm-kbd">'+keyboardSVG(c)+'</div>'
      + '<div class="warm-name">'+c.name+'</div>'
      + '<div class="warm-count" data-count>'+n+'</div></div>';
  }).join('');
}
// light up the shape you're holding; count a play on each fresh grab, skipping consecutive repeats (mashing)
function checkBoard(){
  const notes = [...held.keys()], cards = $("warmGrid").children;
  for(let i=0; i<boardChords.length; i++){
    const on = matchesChord(notes, boardChords[i]);
    cards[i].classList.toggle("lit", on);
    if(on && !litState[i]){                          // rising edge: chord just became fully voiced
      const key = chordKey(boardChords[i]);
      if(key !== lastKey){                            // only count non-consecutive chords
        playCounts[key] = (playCounts[key] || 0) + 1;
        lastKey = key;
        cards[i].classList.add("played");
        const cEl = cards[i].querySelector("[data-count]");
        if(cEl) cEl.textContent = playCounts[key];
      }
    }
    litState[i] = on;
  }
}

/* ---------- MIDI ---------- */
const held = new Map();
function setStatus(on, t){ const el=$("kbdInd"); if(el) el.classList.toggle("on", !!on); const tip=$("kbdTip"); if(tip) tip.textContent = t; }
async function initMidi(){
  if(!navigator.requestMIDIAccess){ setStatus(false, "Web MIDI needs Chrome/Edge on desktop"); return; }
  try {
    const access = await navigator.requestMIDIAccess({sysex:false});
    const pick = () => {
      const ins = [...access.inputs.values()];
      ins.forEach(i => i.onmidimessage = onMidi);
      setStatus(ins.length > 0, ins.length ? (ins[0].name || "keyboard connected") : "no MIDI connected");
    };
    access.onstatechange = pick; pick();
  } catch(e){ console.error('MIDI', e); setStatus(false, "MIDI unavailable — reload"); }
}
function onMidi(ev){
  const [st,d1,d2] = ev.data, cmd = st & 0xF0;
  if(cmd===0x90 && d2>0) held.set(d1,d2);
  else if(cmd===0x80 || (cmd===0x90 && d2===0)) held.delete(d1);
  checkBoard();
}

/* ---------- account nav ---------- */
function renderNav(session){
  const nav = $('navAccount');
  if(session){
    const name = session.user.user_metadata?.username || 'account';
    nav.innerHTML = `<div class="user-menu">
        <button class="nav-user" type="button">@${name} <span class="caret">▾</span></button>
        <div class="user-dropdown">
          <a href="/dashboard">My Dashboard</a>
          <button class="dd-logout" id="logoutBtn">log out</button>
        </div>
      </div>`;
    $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
  } else {
    nav.innerHTML = `<a class="nav-btn" href="/?login=1">log in</a>`;
  }
}

/* ---------- wiring ---------- */
document.querySelectorAll(".filter[data-type]").forEach(b=>b.onclick=()=>toggleType(b.dataset.type));
document.querySelectorAll("#invbar .filter[data-inv]").forEach(b=>b.onclick=()=>toggleInv(+b.dataset.inv));
$("freeBtn").onclick = toggleFreestyle;
// voicing filter popover
const vfBtn=$("voiceFilterBtn"), vfPop=$("voiceFilterPop");
function closeVfPop(){ vfPop.hidden = true; vfBtn.setAttribute("aria-expanded","false"); }
vfBtn.onclick = (e)=>{ e.stopPropagation(); const open = vfPop.hidden; vfPop.hidden = !open; vfBtn.setAttribute("aria-expanded", String(open)); };
vfPop.addEventListener("click", (e)=>{ if(e.target.closest(".filter")) closeVfPop(); });
document.addEventListener("click", (e)=>{ if(!vfPop.hidden && !vfPop.contains(e.target) && !vfBtn.contains(e.target)) closeVfPop(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape" && !vfPop.hidden) closeVfPop(); });

(async () => {
  const { data:{ session } } = await supabase.auth.getSession();
  renderNav(session);
  refresh();       // render the default board (majors · root)
  initMidi();
})();
</script>
