<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(
  'https://pkrvnrgqtuvbtusdncok.supabase.co',
  'sb_publishable_511wgi5up_rKkUMIL91U7A_i_FhDnhE'
);
const $ = id => document.getElementById(id);

/* ---------- chord model (duplicated from Time Trials — DRY later) ---------- */
const ROOTS = [
  {name:"C",pc:0},{name:"C♯",pc:1},{name:"D",pc:2},{name:"E♭",pc:3},
  {name:"E",pc:4},{name:"F",pc:5},{name:"F♯",pc:6},{name:"G",pc:7},
  {name:"A♭",pc:8},{name:"A",pc:9},{name:"B♭",pc:10},{name:"B",pc:11},
];
const CHORD_TYPES = {
  major: { suffix:" Major", ivals:[0,4,7] },
  minor: { suffix:" minor", ivals:[0,3,7] },
  dim:   { suffix:" dim",   ivals:[0,3,6] },
};
const PC_NAME = {}; ROOTS.forEach(r => PC_NAME[r.pc] = r.name);
// root-position chord (no bass requirement — any voicing is accepted when playing)
function chordFor(r, type){
  const T = CHORD_TYPES[type];
  return { name:r.name+T.suffix, type, pcs: T.ivals.map(i => (r.pc + i) % 12) };
}

// The 7 diatonic triads of a MAJOR key: degree (semitones above tonic) + quality + roman numeral.
// Pattern is the same in every key — that's the whole lesson.
const DIATONIC = [
  { deg:0,  qual:'major', rn:'I'    },
  { deg:2,  qual:'minor', rn:'ii'   },
  { deg:4,  qual:'minor', rn:'iii'  },
  { deg:5,  qual:'major', rn:'IV'   },
  { deg:7,  qual:'major', rn:'V'    },
  { deg:9,  qual:'minor', rn:'vi'   },
  { deg:11, qual:'dim',   rn:'vii°' },
];
// the 12 major keys, by tonic pitch class (chromatic order)
const KEYS = ROOTS.map(r => r.pc);

/* ---------- keyboard visual (duplicated from Time Trials) ---------- */
const WHITE = new Set([0,2,4,5,7,9,11]), ACCENT = "#5b7cfa";
const isW = a => WHITE.has(((a%12)+12)%12), nm = a => PC_NAME[((a%12)+12)%12];
function keyboardSVG(pcs){
  const bassPc = pcs[0], bassAbs = bassPc+24;
  const lit = new Set(pcs.map(pc => bassAbs + ((pc-bassPc+12)%12))), top = Math.max(...lit);
  let sA = bassAbs-2; while(!isW(sA)) sA--;
  let eA = top+2;     while(!isW(eA)) eA++;
  const W=24,H=96,BW=15,BH=60, whites=[];
  for(let a=sA;a<=eA;a++) if(isW(a)) whites.push(a);
  const width = whites.length*W, wI={}; whites.forEach((a,i)=>wI[a]=i);
  let s = `<svg class="hint-kbd" viewBox="0 0 ${width} ${H}" width="${width}" height="${H}">`;
  whites.forEach((a,i)=>{ const on=lit.has(a);
    s += `<rect x="${i*W}" y="0" width="${W-1}" height="${H}" rx="3" fill="${on?ACCENT:'#ffffff'}" stroke="#dcdce3"/>`;
    if(on) s += `<text x="${i*W+W/2}" y="${H-9}" text-anchor="middle" font-size="9" fill="#ffffff">${nm(a)}</text>`;
  });
  for(let a=sA;a<=eA;a++){ if(isW(a)) continue;
    const x=(wI[a-1]+1)*W-BW/2, on=lit.has(a);
    s += `<rect x="${x}" y="0" width="${BW}" height="${BH}" rx="2" fill="${on?ACCENT:'#2a2a30'}"/>`;
    if(on) s += `<text x="${x+BW/2}" y="${BH-7}" text-anchor="middle" font-size="8" fill="#ffffff">${nm(a)}</text>`;
  }
  return s + `</svg>`;
}
// does the held set voice this chord? (right pitch classes — any voicing/inversion counts)
function matchesPcs(notes, pcs){
  if(notes.length !== pcs.length) return false;
  const h = new Set(notes.map(n => ((n%12)+12)%12));
  if(h.size !== pcs.length) return false;
  for(const p of pcs) if(!h.has(p)) return false;
  return true;
}

/* ---------- the board: the 7 diatonic chords of the selected key ---------- */
let tonic = 0;          // pitch class of the current key's tonic
let boardChords = [], litState = [];
function keyName(pc){ return PC_NAME[pc] + ' major'; }
function buildKey(pc){
  return DIATONIC.map(d => {
    const r = ROOTS[(pc + d.deg) % 12];
    return { ...chordFor(r, d.qual), rn: d.rn };
  });
}
function renderKeyBar(){
  $('keybar').innerHTML = KEYS.map(pc =>
    '<button class="filter'+(pc===tonic?' active':'')+'" data-key="'+pc+'">'+PC_NAME[pc]+'</button>'
  ).join('');
}
function renderBoard(){
  boardChords = buildKey(tonic);
  litState = boardChords.map(()=>false);
  $('keyTitle').textContent = keyName(tonic);
  $('board').innerHTML = boardChords.map(c =>
    '<div class="warm-card"><div class="warm-rn">'+c.rn+'</div>'
    + '<div class="warm-kbd">'+keyboardSVG(c.pcs)+'</div>'
    + '<div class="warm-name">'+c.name+'</div></div>'
  ).join('');
}
function selectKey(pc){
  tonic = pc;
  document.querySelectorAll('#keybar .filter').forEach(b=>b.classList.toggle('active', +b.dataset.key===pc));
  renderBoard();
}
// light up whichever diatonic chord you're holding; keep an accent border once played
function checkBoard(){
  const notes = [...held.keys()], cards = $('board').children;
  for(let i=0; i<boardChords.length; i++){
    const on = matchesPcs(notes, boardChords[i].pcs);
    cards[i].classList.toggle('lit', on);
    if(on && !litState[i]) cards[i].classList.add('played');
    litState[i] = on;
  }
}

/* ---------- MIDI ---------- */
const held = new Map();
function setStatus(on, t){ const el=$("kbdInd"); if(el) el.classList.toggle("on", !!on); const tip=$("kbdTip"); if(tip) tip.textContent = t; }
async function initMidi(){
  if(!navigator.requestMIDIAccess){ setStatus(false, "Web MIDI needs Chrome/Edge on desktop"); return; }
  try {
    const access = await navigator.requestMIDIAccess({sysex:false});
    const pick = () => {
      const ins = [...access.inputs.values()];
      ins.forEach(i => i.onmidimessage = onMidi);
      setStatus(ins.length > 0, ins.length ? (ins[0].name || "keyboard connected") : "no MIDI connected");
    };
    access.onstatechange = pick; pick();
  } catch(e){ console.error('MIDI', e); setStatus(false, "MIDI unavailable — reload"); }
}
function onMidi(ev){
  const [st,d1,d2] = ev.data, cmd = st & 0xF0;
  if(cmd===0x90 && d2>0) held.set(d1,d2);
  else if(cmd===0x80 || (cmd===0x90 && d2===0)) held.delete(d1);
  checkBoard();
}

/* ---------- account nav ---------- */
function renderNav(session){
  const nav = $('navAccount');
  if(session){
    const name = session.user.user_metadata?.username || 'account';
    nav.innerHTML = `<div class="user-menu">
        <button class="nav-user" type="button">@${name} <span class="caret">▾</span></button>
        <div class="user-dropdown">
          <a href="/dashboard">My Dashboard</a>
          <button class="dd-logout" id="logoutBtn">log out</button>
        </div>
      </div>`;
    $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
  } else {
    nav.innerHTML = `<a class="nav-btn" href="/?login=1">log in</a>`;
  }
}

/* ---------- wiring ---------- */
$('keybar').addEventListener('click', e => {
  const b = e.target.closest('.filter[data-key]'); if(!b) return;
  selectKey(+b.dataset.key);
});

(async () => {
  const { data:{ session } } = await supabase.auth.getSession();
  renderNav(session);
  renderKeyBar();
  renderBoard();
  initMidi();
})();
</script>
