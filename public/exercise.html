<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exercise — ChordRush</title>
<meta name="description" content="Edit a ChordRush exercise.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://chordrush.app/exercise">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/players.css">
<style>
  .ex-edit { width: 100%; max-width: 760px; margin: 5vh auto 0; padding: 0 24px; text-align: left; }
  .ex-edit [hidden] { display: none !important; }
  .ex-back { font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: none; }
  .ex-back:hover { color: var(--text); }
  .ex-title-input { display: block; width: 100%; box-sizing: border-box; margin: 18px 0 24px; padding: 10px 0; border: 0;
                    border-bottom: 1px solid var(--line); background: transparent; color: var(--text);
                    font-size: 28px; font-weight: 700; outline: none; font-family: inherit; }
  .ex-title-input:focus { border-bottom-color: var(--accent); }
  .ex-title-input:disabled { color: var(--muted); }
  /* describe box: say what you want and the test appears below */
  .ex-ai { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 26px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .ex-ai-input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
                 color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.5; resize: vertical; outline: none; }
  .ex-ai-input:focus { border-color: var(--accent); }
  .ex-ai-input:disabled { opacity: .6; cursor: not-allowed; }
  .ex-ai-row { display: flex; align-items: center; gap: 12px; }
  .ex-ai-btn:not(:disabled) { color: var(--accent); }
  .ex-ai-btn:not(:disabled):hover { border-color: var(--accent); }
  .ex-ai-note { font-size: 13px; line-height: 1.5; color: var(--muted); max-width: 640px; }
  .ex-ai-note.is-error { color: #d64545; }
  .ex-empty { margin-top: 26px; padding: 40px 18px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); font-size: 14px; }
  .ex-unplayable { margin-top: 26px; padding: 28px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--muted); font-size: 14px; line-height: 1.6; }
  .ex-unplayable b { color: var(--text); font-family: var(--mono); }
  .ex-edit-actions { display: flex; align-items: center; gap: 12px; margin-top: 26px; }
  .ex-save { color: var(--accent); }
  .ex-save:not(:disabled):hover { border-color: var(--accent); }
  .ex-del { color: var(--muted); }
  .ex-del:hover { color: #d64545; border-color: #d64545; }
  .ex-status { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

        <span>Test</span>

      <a class="mode-tab" href="/practice">

        <span>Practice</span>

      <a class="mode-tab" href="/leaderboard">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r=".6"/><circle cx="18.5" cy="14" r=".6"/></svg>

  <main class="main">
    <section class="ex-edit">
      <a class="ex-back" href="/create">← Create</a>
      <input id="exTitle" class="ex-title-input" type="text" maxlength="80" placeholder="Untitled exercise" aria-label="Exercise title" disabled>
      <div class="ex-ai">
        <label class="fg-label" for="aiPrompt">Describe your exercise</label>
        <textarea id="aiPrompt" class="ex-ai-input" rows="2" maxlength="400" disabled
          placeholder="e.g. a chord race: major chords in every key, root position, with the keyboard hint"></textarea>
        <div class="ex-ai-row">
          <button id="aiBtn" class="ex-btn ex-ai-btn" type="button" disabled>Generate</button>
          <span id="aiStatus" class="ex-status"></span>
        </div>
        <div id="aiNote" class="ex-ai-note" hidden></div>
      </div>
      <div id="exHost"></div>
      <div class="ex-empty" id="exEmpty">Describe a test above and it will appear here.</div>
      <div class="ex-edit-actions">
        <button id="saveBtn" class="ex-btn ex-save" type="button" disabled>Save</button>
        <button id="delBtn" class="ex-btn ex-del" type="button" hidden>Delete</button>
        <span id="exStatus" class="ex-status"></span>
      </div>
    </section>
  </main>

      <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>

      github

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { EXAMPLES, validateSpec, isBlankSpec, describeSpec } from '/exercise-spec.js';
import { canRunChords } from '/exercise-runner.js';
import { createNotePlayer, createChordPlayer } from '/players.js';
import { connectMidi } from '/midi-input.js';
const supabase = createClient(
  'https://pkrvnrgqtuvbtusdncok.supabase.co',
  'sb_publishable_511wgi5up_rKkUMIL91U7A_i_FhDnhE'
);
const $ = id => document.getElementById(id);
function renderNav(session){
  const nav = $('navAccount');
  if(session){
    const name = session.user.user_metadata?.username || 'account';
    nav.innerHTML = `<div class="user-menu">
        <button class="nav-user" type="button">@${name} <span class="caret">▾</span></button>
        <div class="user-dropdown">
          <a href="/dashboard">My Dashboard</a>
          <button class="dd-logout" id="logoutBtn">log out</button>
        </div>
      </div>`;
    $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
  } else {
    nav.innerHTML = `<a class="nav-btn" href="/?login=1">log in</a>`;
  }
}
/* ---------- exercise page: describe a test, then play it right here ---------- */
// UI mirror of the limit. The database trigger (supabase/exercises.sql) is what actually enforces it.
const MAX_EXERCISES = 5;
const params = new URLSearchParams(location.search);
let exId = params.get('id');           // no id = a new exercise (nothing is saved until the first Save)
let userSession = null;
let spec = null;                       // null = nothing described yet
let player = null;                     // the player currently on screen
let ready = false, busy = false;       // ready = signed in and (if opening a saved one) the exercise loaded
const clone = x => JSON.parse(JSON.stringify(x));
const setStatus = t => { $('exStatus').textContent = t || ''; };
const syncButtons = () => { $('saveBtn').disabled = busy || !ready || !spec || validateSpec(spec).length > 0; };

/* ----- the player on screen ----- */
let midiText = 'Connecting to MIDI…', midiStarted = false;
const showMidiText = () => document.querySelectorAll('.ex-midi').forEach(el => { el.textContent = midiText; });
function ensureMidi(){
  if(midiStarted) return;                              // ask the browser for MIDI only once there is something to play
  midiStarted = true;
  connectMidi({
    onNoteOn: (key, t) => { if(player) player.keyDown(key, t); },
    onNoteOff: (key, t) => { if(player) player.keyUp(key, t); },
    onStatus: text => { midiText = text; showMidiText(); },
  });
}
function mount(){
  if(player){ player.destroy(); player = null; }
  const host = $('exHost'); host.innerHTML = '';
  $('exEmpty').hidden = !!spec;
  if(!spec){ syncButtons(); return; }
  if(spec.pool.kind === 'note') player = createNotePlayer(host, spec);
  else if(canRunChords(spec)) player = createChordPlayer(host, spec);
  else {                                               // a valid test the player can't run yet (diatonic, progressions, voice leading, other scorings)
    const box = document.createElement('div'); box.className = 'ex-unplayable';
    const b = document.createElement('b'); b.textContent = describeSpec(spec);
    box.append(b, document.createElement('br'), "This kind of test can't be played here yet. It's saved fine, and you can describe a different one above.");
    host.appendChild(box);
  }
  if(player){ showMidiText(); ensureMidi(); }
  syncButtons();
}
document.addEventListener('keydown', e => {
  if(!player || !(e.code === 'Space' || e.key === ' ') || e.repeat) return;
  const t = e.target, tag = t && t.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;   // a space typed into the title or the describe box is just a space
  e.preventDefault();                                   // also stops a focused button from being "clicked" by the space
  player.restart();
});

/* ----- describe it: the sentence becomes a test ----- */
const AI_PER_DAY = 5;   // mirrors LIMITS.perUserPerDay in src/generate-exercise.js (a label only; the server enforces the limit)
let aiBusy = false, autoTitle = '';
const leftLabel = n => Math.max(0, n) + (n === 1 ? ' generation' : ' generations') + ' left today';
function setAiNote(text, isError){ const n = $('aiNote'); n.textContent = text || ''; n.hidden = !text; n.classList.toggle('is-error', !!isError); }
function syncAi(){
  $('aiPrompt').disabled = !userSession;
  $('aiBtn').disabled = !userSession || aiBusy || !$('aiPrompt').value.trim();
}
async function showAiBudget(){   // "n left today", read from the one row the database lets you see
  const day = new Date().toISOString().slice(0, 10);   // the server counts in UTC days
  const { data, error } = await supabase.from('ai_usage').select('requests').eq('user_id', userSession.user.id).eq('day', day).maybeSingle();
  if(error) return;   // usage table not set up yet: just don't show a count
  $('aiStatus').textContent = leftLabel(AI_PER_DAY - ((data && data.requests) || 0));
}
async function generate(){
  const prompt = $('aiPrompt').value.trim();
  if(!prompt || aiBusy || !userSession) return;
  aiBusy = true; syncAi(); setAiNote(''); $('aiStatus').textContent = 'Thinking…';
  let left = '';
  try {
    const { data:{ session } } = await supabase.auth.getSession();   // a fresh token, since they expire
    const resp = await fetch('/api/generate-exercise', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (session ? session.access_token : '') },
      body: JSON.stringify({ prompt }),
    });
    let data = null; try { data = await resp.json(); } catch {}
    if(!data) setAiNote("Couldn't reach the generator. Try again in a moment.", true);
    else {
      if(typeof data.remaining === 'number') left = leftLabel(data.remaining);
      if(data.ok && !validateSpec(data.spec).length){          // the browser re-checks, even though the server already did
        spec = clone(data.spec);
        const cur = $('exTitle').value.trim();
        if(data.title && (!cur || cur === 'Untitled exercise' || cur === autoTitle)){ $('exTitle').value = data.title; autoTitle = data.title; }   // never overwrite a title you typed
        mount(); setStatus('');
        setAiNote((data.note ? data.note + ' ' : '') + 'Try it below, then Save.');
      }
      else if(data.ok) setAiNote("That didn't come out right. Try rephrasing.", true);
      else if(data.unsupported) setAiNote(data.message || "That isn't something I can make yet.", false);
      else setAiNote(data.error || "Couldn't generate that. Try again.", true);
    }
  } catch(e){ console.error('generate', e); setAiNote("Couldn't reach the generator. Try again in a moment.", true); }
  $('aiStatus').textContent = left;
  aiBusy = false; syncAi();
}
$('aiBtn').onclick = generate;
$('aiPrompt').addEventListener('input', syncAi);
$('aiPrompt').addEventListener('keydown', e => { if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); generate(); } });

/* ----- load / save / delete ----- */
async function loadExercise(){
  // owner filter: someone else's public exercise is readable but is not yours to edit
  const { data, error } = await supabase.from('exercises').select('id, title, spec').eq('id', exId).eq('user_id', userSession.user.id).maybeSingle();
  if(error || !data){ if(error) console.error('load exercise', error); setStatus("Couldn't find that exercise."); return false; }
  $('exTitle').value = data.title;
  $('delBtn').hidden = false;
  if(isBlankSpec(data.spec)) { spec = null; setStatus('This exercise is blank. Describe a test above.'); }
  else if(validateSpec(data.spec).length){ spec = null; setStatus("This exercise's settings were not valid, so it was cleared. Describe a test above, then Save."); }
  else spec = clone(data.spec);
  mount();
  return true;
}
async function saveExercise(){
  if(!spec) return;
  const title = $('exTitle').value.trim() || 'Untitled exercise';
  const problems = validateSpec(spec);
  if(problems.length){ setStatus(problems[0]); return; }
  busy = true; syncButtons(); setStatus('Saving…');
  if(exId){
    const { data, error } = await supabase.from('exercises').update({ title, spec }).eq('id', exId).select('id');
    if(error){ console.error('update exercise', error); setStatus("Couldn't save. Try again."); }
    else if(!data || !data.length) setStatus('This exercise no longer exists. Go back to Create.');   // deleted in another tab
    else setStatus('Saved');
  } else {
    const { data, error } = await supabase.from('exercises').insert({ user_id: userSession.user.id, title, spec }).select('id').single();
    if(error){
      console.error('insert exercise', error);
      setStatus(String(error.message || '').includes('exercise limit reached')
        ? "You've reached the limit of " + MAX_EXERCISES + " exercises. Delete one from the Create page to free a slot."
        : "Couldn't save. Try again.");
    } else {
      exId = data.id;
      history.replaceState(null, '', '/exercise?id=' + encodeURIComponent(exId));   // this tab now points at the saved exercise
      $('delBtn').hidden = false;
      setStatus('Saved');
    }
  }
  busy = false; syncButtons();
}
async function deleteExercise(){
  if(!confirm("Delete this exercise? This can't be undone.")) return;
  const { error } = await supabase.from('exercises').delete().eq('id', exId);
  if(error){ console.error('delete exercise', error); setStatus("Couldn't delete. Try again."); return; }
  location.href = '/create';
}

$('saveBtn').onclick = saveExercise;
$('delBtn').onclick = deleteExercise;
$('exTitle').addEventListener('keydown', e => { if(e.key === 'Enter' && !$('saveBtn').disabled) saveExercise(); });

(async () => {
  const { data:{ session } } = await supabase.auth.getSession();
  userSession = session;
  renderNav(session);
  if(!exId){                                           // a brand-new exercise: blank, or a copy of one of the examples
    const tpl = EXAMPLES.find(x => x.id === params.get('template'));
    if(tpl){ spec = clone(tpl.spec); $('exTitle').value = tpl.title; autoTitle = tpl.title; setStatus('Copy of the “' + tpl.title + '” example. Not saved yet.'); }
  }
  mount();                                             // anyone can play; describing and saving need a login
  if(!session){ setStatus(spec ? 'Log in to save exercises.' : 'Log in to describe and save exercises.'); syncAi(); return; }
  if(exId && !(await loadExercise())) return;          // an id that can't be loaded (not yours / deleted) stays read-only
  ready = true;
  $('exTitle').disabled = false; syncButtons(); syncAi(); showAiBudget();
  if(!exId && !spec) $('aiPrompt').focus();
})();
</script>
</body>
