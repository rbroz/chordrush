<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play — ChordRush</title>
<meta name="description" content="Play a ChordRush game with your MIDI keyboard.">
<link rel="canonical" href="https://chordrush.app/play">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/players.css">
<style>
  .pl-wrap { width: 100%; max-width: 760px; margin: 5vh auto 0; padding: 0 24px; text-align: left; }
  .pl-back { font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: none; }
  .pl-back:hover { color: var(--text); }
  .pl-wrap h1 { font-size: 28px; font-weight: 700; color: var(--text); margin: 16px 0 6px; }
  .pl-blurb { font-size: 14px; color: var(--muted); margin: 0 0 22px; }
  .pl-wrap [hidden] { display: none !important; }
  .pl-set { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 18px; }
  .pl-set-group { display: flex; align-items: center; gap: 10px; }
  .pl-set .filter { padding: 7px 12px; font-size: 13px; }
  .pl-timed { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; }
  .pl-timed.active { border-color: var(--accent); }
  .pl-missing { margin-top: 26px; padding: 28px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

    <a class="brand" href="/">

      <span><span class="accent">Chord</span>Rush</span>
    </a>
    <nav class="mode-nav">
      <a class="mode-tab" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="7"/><path d="M12 14V10"/><path d="M9 2h6"/><path d="M12 2v2"/></svg>
        <span>Test</span>
      </a>
      <a class="mode-tab" href="/practice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v9"/><path d="M15 5v9"/></svg>
        <span>Practice</span>
      </a>
      <a class="mode-tab" href="/leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M8 20v-6"/><path d="M12 20v-10"/><path d="M16 20v-4"/></svg>
        <span>Leaderboard</span>
      </a>
      <a class="mode-tab active" href="/games" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r=".6"/><circle cx="18.5" cy="14" r=".6"/></svg>
        <span>Games</span>
      </a>
    </nav>
    <div class="nav-account" id="navAccount"></div>
  </header>

  <main class="main">
    <section class="pl-wrap">
      <a class="pl-back" href="/games">← Games</a>
      <h1 id="plTitle"></h1>
      <p class="pl-blurb" id="plBlurb"></p>
      <div class="pl-set" id="plSet" hidden>
        <div class="pl-set-group"><span class="fg-label">Reps</span><div class="filterbar" id="plReps"></div></div>
        <button type="button" class="filter pl-timed" id="plTimed" aria-pressed="false"></button>
      </div>
      <div id="exHost"></div>
      <div class="pl-missing" id="plMissing" hidden>That game isn't here. <a href="/games">Pick one from the Games page.</a></div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="/about" class="footer-link">
      <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      about
    </a>
    <a href="https://discord.gg/SCjKGuJjCp" target="_blank" rel="noopener" class="footer-link">
      <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      discord

    <a href="https://github.com/rbroz/chordrush" target="_blank" rel="noopener" class="footer-link">
      <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      github
    </a>
  </footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { GAMES } from '/games.js';
import { canRunChords } from '/exercise-runner.js';
import { createNotePlayer, createChordPlayer } from '/players.js';
import { connectMidi } from '/midi-input.js';
const supabase = createClient(
  'https://pkrvnrgqtuvbtusdncok.supabase.co',
  'sb_publishable_511wgi5up_rKkUMIL91U7A_i_FhDnhE'
);
const $ = id => document.getElementById(id);
function renderNav(session){
  const nav = $('navAccount');
  if(session){
    const name = session.user.user_metadata?.username || 'account';
    nav.innerHTML = `<div class="user-menu">
        <button class="nav-user" type="button">@${name} <span class="caret">▾</span></button>
        <div class="user-dropdown">
          <a href="/dashboard">My Dashboard</a>
          <button class="dd-logout" id="logoutBtn">log out</button>
        </div>
      </div>`;
    $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
  } else {
    nav.innerHTML = `<a class="nav-btn" href="/?login=1">log in</a>`;
  }
}
/* ---------- play one game: nothing is saved to your account, nothing goes on a leaderboard ---------- */
// The two settings (timed, reps) are remembered in this browser for each game.
const game = GAMES.find(g => g.id === new URLSearchParams(location.search).get('game'));
let player = null, settings = null;
const storeKey = () => 'chordrush:game:' + game.id;
function loadSettings(){
  const s = { ...game.defaults };
  try {
    const saved = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    if(saved && typeof saved.timed === 'boolean') s.timed = saved.timed;
    if(saved && game.repOptions.includes(saved.reps)) s.reps = saved.reps;
  } catch(e) {}
  return s;
}
function saveSettings(){ try { localStorage.setItem(storeKey(), JSON.stringify(settings)); } catch(e) {} }
function drawSettings(){
  $('plReps').innerHTML = game.repOptions.map(n => '<button type="button" class="filter' + (n === settings.reps ? ' active' : '') + '" data-reps="' + n + '">' + n + '</button>').join('');
  const b = $('plTimed'); b.classList.toggle('active', settings.timed); b.setAttribute('aria-pressed', String(settings.timed)); b.textContent = 'timed ' + (settings.timed ? 'on' : 'off');
}
let midiText = 'Connecting to MIDI…';
const showMidi = () => document.querySelectorAll('.ex-midi').forEach(el => { el.textContent = el.classList.contains('ex-midi-quiet') && midiText.startsWith('Connected:') ? '' : midiText; });   // quiet ones stay blank when all is well
function toggleTimed(){
  settings.timed = !settings.timed;
  if(player && player.setTimed){                       // the note game: flip the clock in place, keep the note and the score
    saveSettings(); drawSettings(); player.setTimed(settings.timed); document.activeElement && document.activeElement.blur();
  } else settingsChanged();                            // the chord race: a fresh game
}
function settingsChanged(){ saveSettings(); drawSettings(); mountGame(); document.activeElement && document.activeElement.blur(); }   // blur so the space bar restarts instead of re-pressing a button
function mountGame(){                                  // (re)build the player with the current settings: a fresh game
  if(player){ player.destroy(); player = null; }
  const host = $('exHost'), spec = game.spec, options = { reps: settings.reps, timed: settings.timed };
  if(spec.pool.kind === 'note') player = createNotePlayer(host, spec, { ...options, onTimedToggle: toggleTimed });   // the note game has its own stopwatch button in the score bar
  else if(canRunChords(spec)) player = createChordPlayer(host, spec, options);
  showMidi();
}
if(!game){ $('plMissing').hidden = false; }
else {
  document.title = game.title + ' — ChordRush';
  $('plTitle').textContent = game.title;
  $('plBlurb').textContent = game.blurb;
  settings = loadSettings();
  $('plSet').hidden = false; $('plTimed').hidden = game.spec.pool.kind === 'note'; drawSettings(); mountGame();
  $('plReps').addEventListener('click', e => { const b = e.target.closest('[data-reps]'); if(!b) return; settings.reps = +b.dataset.reps; settingsChanged(); });
  $('plTimed').addEventListener('click', toggleTimed);
  connectMidi({
    onNoteOn: (key, t) => { if(player) player.keyDown(key, t); },
    onNoteOff: (key, t) => { if(player) player.keyUp(key, t); },
    onStatus: text => { midiText = text; showMidi(); },
  });
  document.addEventListener('keydown', e => {
    if(!player || !(e.code === 'Space' || e.key === ' ') || e.repeat) return;
    const t = e.target, tag = t && t.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    e.preventDefault();                                 // also stops a focused button from being "clicked" by the space
    player.restart();
  });
}
(async () => { const { data:{ session } } = await supabase.auth.getSession(); renderNav(session); })();
</script>
</body>
</html>
