<style>
  .lb-wrap { max-width: 1120px; margin: 4vh auto 0; }
  .lb-heading { text-align: center; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 28px; }
  .lb-loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .lb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 22px; }
  .lb-card { border: 1px solid var(--line); border-radius: 12px; padding: 15px 16px 9px; }
  .lb-card.empty { opacity: .5; }
  .lb-card-title { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .lb-row { display: flex; align-items: center; gap: 12px; padding: 6px 2px; font-size: 13px; border-top: 1px solid var(--line); }
  .lb-row:first-of-type { border-top: 0; }
  .lb-row .r { width: 12px; color: var(--muted); flex: none; }
  .lb-row .w { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .lb-row .t { width: 48px; text-align: right; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  .lb-row .pc, .lb-row .ac, .lb-row .dt { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; flex: none; }
  .lb-row .pc { width: 48px; }
  .lb-row .ac { width: 30px; }
  .lb-row .dt { width: 40px; }
  .lb-row.top1 .r, .lb-row.top1 .t { color: var(--accent); font-weight: 700; }
  .lb-head span { color: var(--muted) !important; font-weight: 400 !important; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
  .lb-card-empty { font-size: 13px; color: var(--muted); padding: 6px 2px 10px; }
  .lb-filters { display: flex; justify-content: center; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  .lb-title { text-align: center; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }
  table.lb { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.lb th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: right; padding: 0 10px 12px; white-space: nowrap; }
  table.lb th.l, table.lb td.l { text-align: left; }
  table.lb td { padding: 12px 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); white-space: nowrap; }
  table.lb td.who { color: var(--text); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  table.lb td.rank { color: var(--muted); width: 32px; }
  table.lb td.time { color: var(--text); font-weight: 600; }
  table.lb tr.top1 td.rank, table.lb tr.top1 td.time { color: var(--accent); }
  .lb-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }
</style>
</head>

      <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(
  'https://pkrvnrgqtuvbtusdncok.supabase.co',
  'sb_publishable_511wgi5up_rKkUMIL91U7A_i_FhDnhE'
);
const $ = id => document.getElementById(id);
const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// label any Time Trials mode key (e.g. "major", "major|1", "major+minor|0,1,2")
const TYPE_LABEL = { major:'majors', minor:'minors', maj7:'maj7', min7:'min7', dom7:'dom7' };
const INV_LABEL = ['root','1st inv','2nd inv','3rd inv'];
function labelForMode(m){
  const [tp, ip] = m.split('|');
  const types = tp.split('+').map(t => TYPE_LABEL[t] || t).join(' + ');
  if(!ip)           return types + ' · root';
  if(ip === 'free') return types + ' · any voicing';
  return types + ' · ' + ip.split(',').map(i => INV_LABEL[+i] || i).join('/');
}

// one call returns every populated board's top 5; render a card per mode that has plays
async function loadAll(){
  const { data, error } = await supabase.rpc('get_all_boards', { p_limit: 5 });
  const rows = error ? [] : (data || []);
  const byMode = new Map();
  for(const r of rows){
    // only boards you can still create: one chord type × one voicing (incl. "any voicing" = |free); hide multi-type "+" / multi-voicing ","
    if(r.mode.includes('+') || r.mode.includes(',')) continue;
    if(!byMode.has(r.mode)) byMode.set(r.mode, []);
    byMode.get(r.mode).push(r);
  }
  if(!byMode.size){ $('lbGrid').innerHTML = '<div class="lb-loading">No times yet — be the first!</div>'; return; }
  const modes = [...byMode.keys()].sort((a, b) => {         // busiest boards first, then fastest #1
    const A = byMode.get(a), B = byMode.get(b);
    return (B.length - A.length) || (A[0].time_ms - B[0].time_ms);
  });
  $('lbGrid').innerHTML = modes.map(m => {
    const rs = byMode.get(m).sort((x, y) => x.rank - y.rank);
    const body = rs.map(r => {
      const t = r.time_ms/1000, cc = r.chord_count || 12;
      const acc = r.errors == null ? '—' : Math.round(cc/(cc+r.errors)*100)+'%';
      let date=''; try{ date=new Date(r.played_at).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){}
      return `<div class="lb-row${r.rank===1?' top1':''}"><span class="r">${r.rank}</span><span class="w">${escapeHtml(r.username || 'player')}</span><span class="t">${t.toFixed(2)}s</span><span class="pc">${(t/cc).toFixed(2)}/ch</span><span class="ac">${acc}</span><span class="dt">${date}</span></div>`;
    }).join('');
    const head = '<div class="lb-row lb-head"><span class="r">#</span><span class="w">player</span><span class="t">time</span><span class="pc">/ch</span><span class="ac">acc</span><span class="dt">date</span></div>';
    return `<div class="lb-card"><div class="lb-card-title">${labelForMode(m)}</div>${head}${body}</div>`;
  }).join('');
}

// ---------- nav account ----------
function renderNav(session){
  const nav = $('navAccount');
  if(session){
    const name = session.user.user_metadata?.username || 'account';
    nav.innerHTML = `<div class="user-menu">
        <button class="nav-user" type="button">@${name} <span class="caret">▾</span></button>
        <div class="user-dropdown">
          <a href="/dashboard">My Dashboard</a>
          <button class="dd-logout" id="logoutBtn">log out</button>
        </div>
      </div>`;
    $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
  } else {
    nav.innerHTML = `<a class="nav-btn" href="/?login=1">log in</a>`;
  }
}

(async () => {
  const { data:{ session } } = await supabase.auth.getSession();
  renderNav(session);
  loadAll();
})();
</script>
